<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Template</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f9;
      color: #333333;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
    >
      <tr>
        <td align="center" style="padding: 40px 0">
          <table
            role="presentation"
            width="600"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="
              background-color: #ffffff;
              border-radius: 12px;
              box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
              overflow: hidden;
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  padding: 40px 40px 20px 40px;
                  text-align: left;
                  border-bottom: 1px solid #f0f0f0;
                "
              >
                <div style="display: flex; align-items: center; gap: 12px">
                  <img
                    src="https://portfolio.ayushkumarakt.vercel.app/logo1.png"
                    alt="Logo"
                    style="width: 40px; height: auto"
                  />
                  <span
                    style="
                      font-size: 20px;
                      font-weight: 700;
                      color: #1a73e8;
                      letter-spacing: -0.5px;
                    "
                    >Ayush Kumar</span
                  >
                </div>
              </td>
            </tr>
            <!-- Body -->
            <tr>
              <td style="padding: 40px; line-height: 1.6; font-size: 16px">
                {{BODY_CONTENT}}
              </td>
            </tr>
            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 30px 40px;
                  background-color: #fafbfc;
                  text-align: center;
                  border-top: 1px solid #f0f0f0;
                "
              >
                <div style="margin-bottom: 15px">
                  <a
                    href="https://linkedin.com/in/ayushkumarakt"
                    style="
                      color: #1a73e8;
                      text-decoration: none;
                      margin: 0 10px;
                      font-size: 14px;
                      font-weight: 500;
                    "
                    >LinkedIn</a
                  >
                  <span style="color: #cbd5e0">•</span>
                  <a
                    href="mailto:ayushkumarakt@gmail.com"
                    style="
                      color: #1a73e8;
                      text-decoration: none;
                      margin: 0 10px;
                      font-size: 14px;
                      font-weight: 500;
                    "
                    >Contact</a
                  >
                </div>
                <p style="margin: 0; font-size: 12px; color: #718096">
                  © {{YEAR}} Ayush Kumar. Built with passion.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
